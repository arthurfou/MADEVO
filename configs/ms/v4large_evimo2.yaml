# Entraînement du modèle de motion segmentation seul (jalon M1).
# Lancement : launch/tmux.sh --seeds 1-5 jobs/train_ms.sh configs/ms/v4large_evimo2.yaml
exp: v4large_evimo2

data:
  root: datasets/evimo2/samsung_mono
  train_sequences:
    - imo/train/scene10_dyn_train_00_000000
    - imo/train/scene10_dyn_train_01_000000
    - imo/train/scene10_dyn_train_02_000000
    - imo/train/scene10_dyn_train_03_000000
    - imo/train/scene10_dyn_train_04_000000
    - imo/train/scene12_dyn_test_00_000000
    - imo/train/scene12_dyn_test_01_000000
    - imo/train/scene13_dyn_test_01_000000
    - imo/train/scene13_dyn_test_02_000000
    - imo/train/scene13_dyn_test_03_000000
    - imo/train/scene14_dyn_test_00_000000
    - imo/train/scene14_dyn_test_01_000000
    - imo/train/scene14_dyn_test_02_000000
    - imo/train/scene15_dyn_test_00_000000
    - imo/train/scene15_dyn_test_03_000000
    - imo/train/scene15_dyn_test_04_000000
    - imo/train/scene15_dyn_test_06_000000
    - imo/train/scene6_dyn_train_03_000000
    - imo/train/scene9_dyn_train_01_000000
    - imo/train/scene9_dyn_train_02_000000
    - imo/train/scene9_dyn_train_06_000000
  val_sequences:
    - imo/eval/scene13_dyn_test_00_000000
    - imo/eval/scene13_dyn_test_05_000000
    - imo/eval/scene14_dyn_test_03_000000
    - imo/eval/scene14_dyn_test_04_000000
    - imo/eval/scene14_dyn_test_05_000000
    - imo/eval/scene15_dyn_test_01_000000
    - imo/eval/scene15_dyn_test_02_000000
    - imo/eval/scene15_dyn_test_05_000000
  seq_len: 16
  nb_time_bins: 5
  patch_size: 4
  mask_thicken_radius: 3
  # Définition de « dynamique » dans le masque GT, choisie en T7 sur le split train
  # (docs/mask_motion.md) : un objet est dynamique à l'instant t s'il s'écarte de plus
  # de 1 cm de sa position médiane dans la fenêtre [t − 0,1 s, t + 0,1 s].
  # L'ablation `all` (définition du stage) est configs/ms/v4_evimo2_all.yaml.
  mask_motion: frame
  motion_thresh_m: 0.01
  motion_window_s: 0.2

model:
  name: convlstm_v4
  hidden_dim: 128
  num_groups: 8

training:
  epochs: 100
  batch_size: 8
  lr: 1.0e-3
  weight_decay: 1.0e-4
  use_scheduler: true
  loss: bce_dice
  loss_pos_weight: 7.0   # ≈ √(neg/pos) = √49 en mode frame sur le split train (T7)
  images_every: 1      # voxels / masque prédit / masque GT sur wandb tous les N epochs
  num_workers: 4

wandb:
  project: ms-model
  entity: arthurfou-cole-polytechnique
