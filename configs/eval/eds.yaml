# Validation cross-dataset : EDS (Hidalgo-Carrió et al., CVPR 2022), 9 scènes, calibration calib0.
# Pas de masque GT de mouvement : pas d'oracle, seulement vanilla et les modèles appris
# (entraînés sur EVIMO2 seul). Données : bash scripts/download/download_eds.sh
# Lancement : launch/tmux.sh --seeds 1-5 jobs/eval_table.sh configs/eval/eds.yaml
exp: eval_eds

dataset:
  name: eds
  root: ${MADEVO_DATASETS:-datasets}/eds                     # --datapath (format DEVO, produit par scripts/pp_eds.py)
  split: splits/eds/eds_val.txt

devo:
  weights: ${MADEVO_PRETRAINED:-pretrained}/DEVO.pth
  config: config/eval_eds.yaml           # hyperparamètres VO de DEVO amont pour ce dataset

methods: [vanilla, m1, m2, m3]
sources: evimo2                         # mêmes checkpoints que la table EVIMO2 nominale

threshold: null                         # null = score continu, sinon seuil binaire
export_map: false
