# Validation cross-dataset : MVSEC indoor_flying 1-4 (Zhu et al., RA-L 2018), caméra gauche.
# Pas de masque GT de mouvement : pas d'oracle, seulement vanilla et les modèles appris
# (entraînés sur EVIMO2 seul). Données : bash scripts/download/download_mvsec.sh
# Lancement : launch/tmux.sh --seeds 1-5 jobs/eval_table.sh configs/eval/mvsec.yaml
exp: eval_mvsec

dataset:
  name: mvsec
  root: ${MADEVO_DATASETS:-datasets}/mvsec                     # --datapath (format DEVO, produit par scripts/pp_mvsec.py)
  split: splits/mvsec/mvsec_val.txt

devo:
  weights: ${MADEVO_PRETRAINED:-pretrained}/DEVO.pth
  config: config/eval_mvsec.yaml           # hyperparamètres VO de DEVO amont pour ce dataset

methods: [vanilla, m1, m2, m3]
sources: evimo2                         # mêmes checkpoints que la table EVIMO2 nominale

threshold: null                         # null = score continu, sinon seuil binaire
save_viz: false                                # --set save_viz=true : score maps et patches par frame
export_map: false
