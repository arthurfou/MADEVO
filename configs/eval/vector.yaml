# Validation cross-dataset : VECtor (Gao et al., RA-L 2022), 17 scènes, caméra event gauche.
# Pas de masque GT de mouvement : pas d'oracle, seulement vanilla et les modèles appris
# (entraînés sur EVIMO2 seul). Données : bash scripts/download/download_vector.sh
# Lancement : launch/tmux.sh --seeds 1-5 jobs/eval_table.sh configs/eval/vector.yaml
exp: eval_vector

dataset:
  name: vector
  root: ${MADEVO_DATASETS:-datasets}/vector                     # --datapath (format DEVO, produit par scripts/pp_vector.py)
  split: splits/vector/vector_val.txt

devo:
  weights: ${MADEVO_PRETRAINED:-pretrained}/DEVO.pth
  config: config/eval_vector.yaml           # hyperparamètres VO de DEVO amont pour ce dataset

methods: [vanilla, m1, m2, m3]
sources: evimo2                         # mêmes checkpoints que la table EVIMO2 nominale

threshold: null                         # null = score continu, sinon seuil binaire
save_viz: false                                # --set save_viz=true : score maps et patches par frame
export_map: false
