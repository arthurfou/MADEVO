# Valeurs de référence pour valider une installation sur un nouveau serveur (T10).
# Seul DEVO vanilla sert de référence : il ne dépend ni des masques ni des bugs corrigés
# depuis le stage (cf. INTEGRITY_CHECK.md). ATE en cm, moyenne des scènes.
#
# Contrôle : python tools/check_nonregression.py <dossiers d'éval seed1 seed2 …> --dataset evimo2
evimo2:
  source: "5 seeds sur royce (RTX 4000 Ada, torch 2.4.1/CUDA 11.8), 2026-11-11 ; cf. INTEGRITY_CHECK.md"
  # Seeds 1-5 : 2,294 / 2,721 / 2,197 / 2,164 / 2,113. Le stage donnait 2,7507 (et 2,6744),
  # sur des caches de voxels antérieurs au bug 3 : c'est vanilla à 2,30 qui fait foi désormais.
  vanilla_mean: 2.298
  vanilla_seed_std: 0.246    # écart-type entre seeds d'une passe (scene14_dyn_test_03 : 1,7 à 7,2)
  rel_tolerance: 0.10        # plancher ; tolérance effective max(10 %, 2 σ/√n)
rpg:
  source: "results.md, Tableau 1 (reproduction DEVO du stage, 6 scènes rapportées)"
  vanilla_per_scene:
    bin: 0.842
    boxes1: 0.915
    monitor1: 0.549
    boxes2: 0.965
    monitor2: 0.718
    reader: 1.194
  rel_tolerance: 0.25        # par scène : les petites ATE (< 1 cm) varient vite
  mean_rel_tolerance: 0.15   # sur la moyenne de ces 6 scènes (0,864 cm)
